services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      CLUB_NAME: ${CLUB_NAME:-}
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
    volumes:
      - handball-data:/data
    ports:
      # Only reachable from the host itself; Caddy is the public entry point.
      - "127.0.0.1:3001:3001"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  handball-data:
  caddy_data:
  caddy_config:
